[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "followline-rl"
version = "0.1.0"
description = "Experimental Gymnasium adapter for RoboticsAcademy FollowLine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "gymnasium>=0.29,<1.4"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3,<3"]
test = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
include = ["followline_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
